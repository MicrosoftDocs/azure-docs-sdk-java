  fullName: "com.azure.resourcemanager.resources.policy.models.PolicyExemptions.list()"
  name: "list()"
  nameWithType: "PolicyExemptions.list()"
  summary: "Retrieves all policy exemptions that apply to a subscription."
  modifiers:
  - "abstract"
  syntax: "public abstract PagedIterable<PolicyExemption> list()"
  desc: "Retrieves all policy exemptions that apply to a subscription. This operation retrieves the list of all policy exemptions associated with the given subscription that match the optional given $filter. Valid values for $filter are: 'atScope()', 'atExactScope()', 'excludeExpired()' or 'policyAssignmentId eq '\\{value\\}''. If $filter is not provided, the unfiltered list includes all policy exemptions associated with the subscription, including those that apply directly or from management groups that contain the given subscription, as well as any applied to objects contained within the subscription."
